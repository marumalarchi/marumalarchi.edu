const card=(i,title,n)=>`<div class="card rv relative rounded-[22px] border border-[#dbe6f5] bg-white p-7 shadow-[0_8px_28px_rgba(29,58,138,.10)] transition hover:-translate-y-[5px]">${n?`<span class="absolute -top-3 right-5 grid h-8 w-8 place-items-center rounded-full bg-[#2f6fd0] text-sm font-bold text-white">${n}</span>`:""}<div class="ic mb-4 grid h-[54px] w-[54px] place-items-center rounded-2xl bg-[#e3f5ec] text-[#1f8a5b]">${ic(i,28)}</div><h3>${title}</h3></div>`;
const tel=()=>SITE.phones.map(p=>`<a href="tel:${p[0]}" class="block font-bold hover:underline">${p[1]}</a>`).join("");
const fld=(k,label,x,tall)=>`<div class="mb-4"><label for="${k}" class="mb-1 block font-bold ${tall?"sm:flex sm:min-h-[3.7rem] sm:items-end":""}"><span>${label} ${k!=="msg"?'<span class="text-red-700">*</span>':""}</span></label>${x}<p id="err-${k}" role="alert" class="mt-1 text-sm font-bold text-red-700" hidden></p></div>`;
function html(){const E=SITE.educator,F=C.f;return `
<header class="sticky top-0 z-50 border-b border-[#dbe6f5] bg-white/95 backdrop-blur"><div class="mx-auto flex h-[72px] max-w-6xl items-center justify-between gap-3 px-5">
<a href="#home" class="font-head flex items-center gap-2 text-[.95rem] font-bold leading-tight text-[#1d3a8a]"><img src="${LOGO}" alt="Marumalarchi logo" width="46" height="46" class="rounded-full"><span class="max-w-[150px] text-sm sm:max-w-none">Marumalarchi<br>Special Education Centre</span></a>
<nav id="nav" aria-label="Main" class="hidden absolute left-0 right-0 top-full border-b bg-white p-4 lg:static lg:block lg:border-0 lg:p-0"><ul class="flex flex-col gap-1 lg:flex-row">${C.nav.map(([id,l])=>`<li><a href="#${id}" class="block rounded-full px-3 py-2 text-[.95rem] font-bold hover:bg-[#e3f5ec]">${t(l)}</a></li>`).join("")}</ul></nav>
<div class="flex items-center gap-2"><button data-lang aria-label="Change language" class="flex min-h-11 items-center gap-1 rounded-full border-2 border-[#1d3a8a] px-3 text-sm font-bold text-[#1d3a8a]">${ic("Languages",18)}${lang==="ta"?"English":"தமிழ்"}</button>
<a href="#enquiry" class="hidden min-h-11 items-center rounded-full bg-[#128c4a] px-5 text-base font-bold text-white sm:inline-flex">${t(C.enq)}</a>
<button id="burger" class="p-2 lg:hidden" aria-label="Menu" aria-expanded="false">${ic("Menu")}</button></div></div></header>
<main>
<section id="home" class="bg-[#f7fbff] py-14 md:py-20" style="background-image:radial-gradient(900px 400px at 85% 0,#fff4d6,transparent 70%),radial-gradient(700px 400px at 0 100%,#e3f5ec,transparent 70%)"><div class="mx-auto grid max-w-6xl items-center gap-10 px-5 md:grid-cols-[1.15fr_.85fr]">
<div class="order-2 animate-rise md:order-1"><span class="${PILL}">${t(C.heroTag)}</span><h1>${t(C.h1)[0]}<em class="not-italic text-[#1f8a5b]">${t(C.h1)[1]}</em></h1><p class="max-w-xl text-[#4b5b78]">${t(C.sub)}</p>
<div class="mt-6 flex flex-wrap gap-3"><a href="#about" class="inline-flex min-h-12 items-center rounded-full bg-[#1d3a8a] px-6 font-bold text-white hover:-translate-y-0.5 hover:shadow-lg">${t(C.explore)}</a>${wa(t(C.waBtn))}</div></div>
<div class="relative order-1 grid place-items-center md:order-2"><div class="w-72 animate-float rounded-full bg-white p-3 shadow-xl sm:w-80"><img src="${LOGO}" alt="Marumalarchi emblem: open book and torch" width="256" height="256" class="w-full rounded-full"></div>
${[[0,"left-0 top-[14%] text-[#1f8a5b]","Heart"],[1,"bottom-[12%] right-0 text-[#1d3a8a]","Star"]].map(([k,c,n])=>`<span style="animation-delay:-${k*3}s" class="absolute hidden animate-float items-center gap-2 rounded-2xl bg-white px-4 py-2 text-base font-bold shadow-lg md:flex ${c}">${ic(n,18)}${t(C.chips[k])}</span>`).join("")}</div></div></section>
${sec("about",0,`<img src="${BANNER}" alt="Marumalarchi Special Education Centre banner with services and contact details" width="1200" height="627" loading="lazy" class="rv mb-12 w-full rounded-[24px] shadow-[0_8px_28px_rgba(29,58,138,.10)]">
<div class="rv mx-auto max-w-3xl"><span class="${PILL}">${t(C.nav[1][1])}</span><h2>${t(C.aboutH)}</h2>${C.about[lang==="ta"?1:0].map(p=>`<p class="mb-4">${p}</p>`).join("")}</div>`)}
${sec("",0,`${head("",t(C.eduH))}<div class="rv mx-auto flex max-w-2xl flex-col items-center gap-6 rounded-3xl bg-gradient-to-br from-[#e3f5ec] to-[#fff4d6] p-8 text-center shadow-md sm:flex-row sm:text-left">
${E.photo?`<img src="${E.photo}" alt="${t(E.name)}" loading="lazy" class="h-32 w-32 flex-none rounded-full object-cover">`:`<div aria-hidden="true" class="grid h-32 w-32 flex-none place-items-center rounded-full bg-[#1d3a8a] text-4xl font-extrabold text-white">${[...t(E.name).replace(/^\S+\s/,"")][0]}</div>`}
<div><p class="text-sm font-bold uppercase tracking-wide text-[#1f8a5b]">${t(C.eduRole)}</p><h3 class="text-2xl">${t(E.name)}</h3><p class="font-bold text-[#4b5b78]">${E.quals}</p><p class="mt-2 text-[#4b5b78]">${t(C.eduTxt)}</p></div></div>`)}
${sec("services",1,`${head(t(C.svcH),t(C.svcT),t(C.svcSub))}<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">${C.svc.map(([i,l])=>card(i,t(l))).join("")}</div>`)}
${sec("",0,`${head(t(C.aprTag),t(C.aprH),t(C.aprSub))}<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">${C.apr.map(([i,l],k)=>card(i,t(l),k+1)).join("")}</div>`)}
${sec("why",1,`${head(t(C.nav[3][1]),t(C.whyH))}<ul class="mx-auto grid max-w-2xl gap-3">${C.why.map(w=>`<li class="rv flex items-center gap-3 rounded-[18px] border border-[#dbe6f5] bg-white px-[22px] py-4 font-bold">${ic("CheckCircle2",24,"flex-none text-[#1f8a5b]")}${t(w)}</li>`).join("")}</ul>`)}
${sec("gallery",0,`${head(t(C.nav[4][1]),t(C.galT))}${SITE.gallery.length?`<div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">${SITE.gallery.map((g,i)=>`<button data-box="${i}" aria-label="${g.alt}" class="aspect-[4/3] overflow-hidden rounded-2xl bg-[#dbe6f5]"><img src="${g.src}" alt="${g.alt}" loading="lazy" class="h-full w-full object-cover transition duration-300 hover:scale-110"></button>`).join("")}</div>`:`<p class="rounded-3xl border-2 border-dashed border-[#dbe6f5] p-10 text-center text-[#4b5b78]">${t(C.galEmpty)}</p>`}`)}
<section id="enquiry" class="bg-gradient-to-br from-[#1d3a8a] to-[#2f6fd0] py-[76px] text-white"><div class="mx-auto grid max-w-6xl items-center gap-10 px-5 md:grid-cols-2"><div><h2 class="text-white">${t(C.enqH)}</h2><p class="text-white/90">${t(C.enqSub)}</p></div>
<form id="f" novalidate class="rv rounded-[26px] bg-white p-[30px] text-[#14213d] shadow-[0_20px_50px_rgba(0,0,0,.25)]">
${fld("name",t(F.name),`<input id="name" name="name" autocomplete="name" class="${inp}">`)}
<div class="grid gap-x-4 sm:grid-cols-2">${fld("phone",t(F.phone),`<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" class="${inp}">`,1)}${fld("age",t(F.age),`<input id="age" name="age" type="number" min="1" max="30" inputmode="numeric" class="${inp}">`,1)}</div>
${fld("type",t(F.type),`<select id="type" name="type" class="${inp}"><option value="">${t(F.pick)}</option>${C.types.map(x=>`<option value="${x[0]}">${t(x)}</option>`).join("")}</select>`)}
${fld("msg",t(F.msg),`<textarea id="msg" name="msg" rows="3" class="${inp} py-3"></textarea>`)}
<button class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full bg-[#128c4a] font-bold text-white hover:bg-[#0e7a40]">${ic("MessageCircle",20)}${t(F.submit)}</button>
<p class="mt-3 text-center text-sm text-[#4b5b78]">${t(F.note)}</p></form></div></section>
${sec("contact",0,`${head(t(C.nav[5][1]),t(C.cT))}<div class="grid gap-8 md:grid-cols-2"><div class="rv space-y-5"><p class="text-xl font-extrabold text-[#1d3a8a]">${NAME}</p>
${[["Phone",C.phoneL,tel()],["MapPin",C.addrL,t(SITE.address)],["Clock",C.hoursL,t(SITE.hours)]].map(([n,l,v])=>`<div class="flex gap-3"><span class="grid h-11 w-11 flex-none place-items-center rounded-xl bg-[#e3f5ec] text-[#1f8a5b]">${ic(n,22)}</span><div><b>${t(l)}</b><div class="text-[#4b5b78]">${v}</div></div></div>`).join("")}${wa(t(C.waUs))}</div>
<div class="rv relative flex min-h-[360px] flex-col overflow-hidden rounded-3xl border border-[#dbe6f5] bg-white shadow-md"><div class="relative min-h-[310px] flex-1 overflow-hidden"><iframe title="Map of ${NAME}" src="https://maps.google.com/maps?cid=${SITE.mapCid}&z=18&hl=en&output=embed" loading="lazy" allowfullscreen class="absolute border-0" style="left:-360px;top:-260px;width:calc(100% + 720px);height:calc(100% + 520px)"></iframe></div>
<div class="pointer-events-none absolute bottom-[72px] left-2 max-w-[70%] rounded-lg bg-white/90 px-2 py-1 text-xs shadow"><b>${NAME}</b></div>
<a href="${SITE.mapsLink}" target="_blank" rel="noopener noreferrer" class="m-3 self-center rounded-full bg-[#1d3a8a] px-5 py-2 text-base font-bold text-white">${t(C.openMap)}</a></div></div>`)}
</main>
<footer class="bg-[#0f1f4d] py-12 text-[#dbe6f8]"><div class="mx-auto grid max-w-6xl gap-8 px-5 md:grid-cols-3">
<div><div class="mb-3 flex items-center gap-3 font-extrabold text-white"><img src="${LOGO}" alt="" width="56" height="56" class="rounded-full">${NAME}</div><p class="text-base">${t(C.foot)}</p></div>
<div><h3 class="mb-3 font-bold text-white">${t(C.links)}</h3><ul class="space-y-1 text-base">${C.nav.map(([id,l])=>`<li><a href="#${id}" class="hover:underline">${t(l)}</a></li>`).join("")}</ul></div>
<div class="space-y-3 text-base">${tel()}<p>${t(SITE.address)}</p>${wa(t(C.waUs))}</div></div>
<p class="mt-8 border-t border-[#2b3f78] pt-5 text-center text-sm">© 2026 Marumalarchi Special Education Centre. All Rights Reserved.</p></footer>
<a href="${waUrl()}" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp" class="fixed bottom-4 right-4 z-40 grid h-14 w-14 place-items-center rounded-full bg-[#128c4a] text-white shadow-xl">${ic("MessageCircle")}</a>`}

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
function render(first){
 const f=document.getElementById("f"),keep=f?Object.fromEntries(new FormData(f)):null;
 app.innerHTML=html();
 if(keep)for(const k in keep){const el=app.querySelector(`[name=${k}]`);if(el)el.value=keep[k]}
 document.documentElement.lang=lang;try{localStorage.setItem("lang",lang)}catch(e){}
 app.querySelectorAll(".rv").forEach(el=>first?io.observe(el):el.classList.add("in"));
}
const cleanPhone=v=>{let d=v.replace(/[\s\-()]/g,"");if(d.startsWith("+91"))d=d.slice(3);else if(d.length===12&&d.startsWith("91"))d=d.slice(2);else if(d.startsWith("0"))d=d.slice(1);return /^[6-9]\d{9}$/.test(d)?d:null};
function openBox(g){const d=document.createElement("div");d.setAttribute("role","dialog");d.setAttribute("aria-label","Photo preview");d.className="fixed inset-0 z-[100] grid place-items-center bg-black/85 p-5";d.innerHTML=`<button aria-label="Close" class="absolute right-4 top-4 grid h-11 w-11 place-items-center rounded-full bg-white">${ic("X")}</button><img src="${g.src}" alt="${g.alt}" class="max-h-[88vh] max-w-full rounded-2xl object-contain">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll('[role=dialog]').forEach(d=>d.remove())});
app.addEventListener("click",e=>{
 if(e.target.closest("[data-lang]")){lang=lang==="ta"?"en":"ta";render(false);return}
 const b=e.target.closest("#burger");if(b){const n=document.getElementById("nav"),o=n.classList.toggle("hidden");n.classList.toggle("block",!o);b.setAttribute("aria-expanded",!o);return}
 if(e.target.closest("#nav a")){const n=document.getElementById("nav");n.classList.add("hidden");n.classList.remove("block")}
 const g=e.target.closest("[data-box]");if(g)openBox(SITE.gallery[g.dataset.box]);
});
app.addEventListener("submit",ev=>{ev.preventDefault();const F=C.f,form=ev.target,d=Object.fromEntries(new FormData(form));
 const ph=cleanPhone(d.phone.trim()),age=parseInt(d.age,10),er={};
 if(d.name.trim().length<2)er.name=t(F.err);if(!ph)er.phone=t(F.errPh);if(!(age>=1&&age<=30))er.age=t(F.err);if(!d.type)er.type=t(F.err);
 ["name","phone","age","type"].forEach(k=>{const p=document.getElementById("err-"+k);p.textContent=er[k]||"";p.hidden=!er[k];document.getElementById(k).setAttribute("aria-invalid",!!er[k])});
 const first=Object.keys(er)[0];if(first){document.getElementById(first).focus();return}
 const text=`Hello ${NAME},\n\nI would like to enquire about your educational services.\n\nParent Name: ${d.name.trim()}\nContact Number: ${ph}\nChild's Age: ${age}\nEnquiry Type: ${d.type}\n\nAdditional Message:\n${d.msg.trim()||"Not provided"}\n\nPlease provide more information about your centre and admission process.\n\nThank you.`;
 const url=waUrl(text);if(!window.open(url,"_blank","noopener"))window.location.href=url});
render(true);
</script></body></html>
